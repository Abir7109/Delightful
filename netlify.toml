[build]
  functions = "netlify/functions"
  publish = "."

# ── Global security headers ──────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://data.mongodb-api.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ── Redirects ────────────────────────────────────────────────────
# Clean /admin alias (no loop)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# ── Block sensitive paths ────────────────────────────────────────
[[redirects]]
  from = "/_backup_hero/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin-check.html"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
